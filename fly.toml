app = "job-os-api"
primary_region = "iad"

[build]
  dockerfile = "infra/fly/Dockerfile.api"
  ignorefile = ".dockerignore"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  APP_ENV = "production"
  LOG_LEVEL = "info"
# Secrets — DATABASE_URL, ANTHROPIC_*, CLERK_*, FIRECRAWL_API_KEY, etc.
# — set via:  flyctl secrets set NAME=value -a job-os-api
