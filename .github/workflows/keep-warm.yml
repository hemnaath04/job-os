name: keep-warm

# Keep the Vercel API container from scaling to zero by hitting /health on a
# tight cadence. The container cold-starts in roughly 9 seconds when idle,
# which stalls the first /jobs and /jobs/{id} call the app makes (the Tailor
# job dropdown and the tailor kickoff both wait on it). A steady trickle of
# requests keeps one instance warm so those calls stay sub-second.
#
# GitHub schedules can be delayed, so each run fires several pings a minute
# apart to cover more of the window. A non-2xx upstream response is logged but
# treated as success: even a 502 proves the request reached the edge and woke
# the container, which is the whole point.

on:
  schedule:
    # Every 5 minutes, offset from the top of the hour when schedulers are busiest.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:          # manual trigger from the Actions UI

# Cancel any in-flight run if a new schedule fires so pings never pile up.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate config
        env:
          URL: https://job-os-api.vercel.app
        run: |
          if [[ "$URL" != https://*.vercel.app ]]; then
            echo "::error::API URL is invalid."
            exit 1
          fi

      - name: Ping /health repeatedly
        env:
          URL: https://job-os-api.vercel.app
        run: |
          # Fire 4 pings 60s apart so one 5-minute run covers most of the
          # window even if the next scheduled run is delayed. 90s max-time
          # comfortably covers a cold-start wake.
          for i in 1 2 3 4; do
            http_status=$(curl -sS -o /tmp/body -w '%{http_code}' \
              --max-time 90 \
              --retry 2 --retry-delay 5 \
              "$URL/health" || echo "curl-failed")
            echo "ping $i status=$http_status"
            if [ "$http_status" = "curl-failed" ]; then
              echo "::warning::curl failed entirely, the backend may be down, not just cold."
            elif [ "$http_status" != "200" ]; then
              echo "::warning::Non-200 status ($http_status), the edge saw the ping but upstream isn't 2xx."
            fi
            if [ "$i" -lt 4 ]; then sleep 60; fi
          done
