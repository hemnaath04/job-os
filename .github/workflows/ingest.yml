# Continuous ATS ingest. Manual dispatch only; the schedule runs on Heroku.
#
# Turning a crawler loose on other people's public APIs is a decision for a person,
# not a side effect of merging a branch. That decision has been made; the numbers
# below are what it costs, and are worth re-reading before anyone widens it.
#
# WHAT IS CRAWLED, and what is deliberately not
#   The schedule crawls five providers. `bamboohr` is registered and seeded with
#   4,992 tokens but is EXCLUDED on purpose, pending evidence that small-company
#   boards earn their share of the table. `icims` (31 tokens) and
#   `smartrecruiters` (9) are excluded too, by omission rather than by argument.
#   The exclusion lives in the `--providers` default below, NOT in the registry,
#   because a scheduled run carries no inputs: leaving that default empty means
#   "every provider in PROVIDERS", so adding a vendor would silently enrol it in
#   the schedule. Naming the five makes enrolment an edit rather than an accident.
#
# WHAT ONE RUN COSTS, measured on this branch at concurrency 8
#   400 tokens is roughly 40 seconds of wall clock and 250MB of transfer on a cold
#   corpus. Re-crawls are far cheaper: conditional GET turned a 200-board Greenhouse
#   re-crawl from 71.9MB into about 2KB, because 139 of those boards answered 304
#   with an empty body. So steady-state cost is dominated by boards that actually
#   changed, which is the right thing to be paying for.
#
# WHY 400 AND NOT THE WHOLE CORPUS
#   A full Greenhouse sweep of 8,333 tokens measured 11.5 minutes on its own, and
#   the whole corpus is 15,874. Coverage is meant to accumulate across runs rather
#   than be forced into one: `ats_board_tokens.next_check_after` schedules live
#   boards every 6 hours, curated companies every 2, empty ones every 3 days and
#   dead ones every 30, so a run that only gets through 400 still gets through the
#   400 that mattered most. Raise --limit if you want more per run and can afford
#   the minutes.
#
# POLITENESS
#   Every request carries a descriptive User-Agent with a contact URL, concurrency
#   is capped per host, 429s are honoured via Retry-After, and 404s are never
#   retried. All four endpoints are the vendors' documented public job-board APIs
#   (Greenhouse, Lever, Ashby, SmartRecruiters), which exist to be syndicated.
#   If you raise concurrency, raise it slowly and watch tokens_error.
#
# ALTERNATIVE SCHEDULERS
#   Nothing here is Actions-specific. `python -m job_os.ingest.cli sweep` is the
#   whole interface. On Heroku, where job-os-api already runs, this is a Scheduler
#   add-on job with the same command. Vercel Cron cannot host it: the sweep runs
#   well past the function timeout.

name: ingest

on:
  workflow_dispatch:
    inputs:
      providers:
        description: "Space-separated subset, or blank for all"
        required: false
        default: ""
      limit:
        description: "Tokens this run may crawl"
        required: false
        default: "400"
      hydrate_limit:
        description: "Postings this run may fetch descriptions for (0 to skip)"
        required: false
        default: "200"
  # PAUSED 2026-08-31, and this was a billing decision rather than a code one.
  #
  # Appwrite bills database reads per ROW, not per API call, and this sweep is
  # read-heavy in a way that is invisible from the request count: one run read
  # every posting it saw, to decide insert versus update, plus a dedupe pool of
  # up to 5,000. Measured on a real run that crawled three boards, that is 8,297
  # reads, and hydration adds 1,600 more.
  #
  # Four runs a day is roughly 1.19 million reads a month before anybody
  # searches. The Free plan allows 500,000 and the Education plan 1,750,000, so
  # the schedule alone was 2.4x the former and 68% of the latter, on a corpus of
  # three boards out of 20,922 seeded. Every Appwrite read on the project was
  # answering 402 `limit_databases_reads_exceeded`.
  #
  # Paused rather than tuned, because the fix was not a smaller number here: a
  # search index is read-heavy by definition and that one was on a store that
  # charges per row. The stated condition for re-enabling was "once
  # `job_postings` lives somewhere that bills for storage instead".
  #
  # THAT CONDITION IS NOW MET. `job_postings` is a Postgres table again
  # (migration `postings_back_to_pg`), so no amount of reading it costs
  # anything per row, and the arithmetic above no longer applies to any step in
  # this workflow.
  #
  # RESUMED 2026-08-31 once that was true, after a 25-token validation run
  # (33447749790) wrote 38,457 rows green end to end.
  #
  # The resource to watch has MOVED rather than gone away: Postgres bills for
  # what the crawl accumulates, not for what search reads. Measured on those
  # first 38,457 rows the table is 79 MB, about 2.1 KB a row at 7% hydration,
  # so the 500 MB tier is roughly 240,000 rows away. Watch table size, not a
  # read counter. See the storage section of `docs/ingest-index.md`.
  #
  # MOVED TO HEROKU SCHEDULER 2026-09-01. Kept here, commented, because
  # `workflow_dispatch` above is still the way to run a one-off crawl by hand,
  # and because the reason this moved is worth keeping next to the thing it
  # moved off.
  #
  # GitHub does not guarantee cron timing, and on this repository it was not
  # close. Measured across the last ten scheduled runs, against the correct
  # slots of 00:17/06:17/12:17/18:17 UTC:
  #
  #     late 101, 324, 173, 267, 341, 311, 160, 267, 51, 247 minutes
  #
  # One run in ten started within the hour, and the median was about four
  # hours. A schedule that says "every six hours" and delivers three to four
  # ragged runs a day is worse than the same cadence stated honestly, because
  # freshness claims in the UI are read off the cron expression.
  #
  # Heroku Scheduler runs one-off dynos on the existing `job-os` app, which is
  # already the API's home, already has DATABASE_URL, and already ships the
  # ingest CLI in its image. Verified there before this change: `sweep` and
  # `hydrate` both run clean, 30 tokens in 38s.
  #
  # Scheduler's own caveat, from its docs: execution is "expected but not
  # guaranteed" and it can rarely miss a job. That is a weaker promise than it
  # sounds, but the observed failure here was lateness rather than misses, and
  # a missed hourly run costs an hour rather than six.
  #
  # THE JOB, as configured in `heroku addons:open scheduler -a job-os`:
  #   frequency: hourly
  #   command:
  #     python -m job_os.ingest.cli sweep --limit 150 --concurrency 8
  #       --providers $INGEST_PROVIDERS;
  #     python -m job_os.ingest.cli hydrate --limit 100
  #       --providers $INGEST_PROVIDERS
  #
  #   (as one line). No `sh -c` wrapper and no absolute path: Scheduler hands
  #   the task to a shell in the dyno, so `;` chains and `$INGEST_PROVIDERS`
  #   expands, and `/app/.venv/bin` is already first on PATH. Verified both.
  #
  # Hourly rather than six-hourly because Scheduler offers only 10-minute,
  # hourly or daily, and daily is too coarse. Per-board cadence is unaffected:
  # `ats_board_tokens.next_check_after` still governs when a board is due, so
  # a more frequent sweep changes when work is picked up, not how much of it
  # there is. `--limit 150` holds a run near three minutes, well inside the
  # dyno cap of one scheduling interval.
  #
  # `;` rather than `&&` between the two, for the same reason the step below
  # carried `if: always()`: hydration fills rows the index already has and is
  # worth running even when the crawl before it failed.
  #
  # The provider pin moved to the `INGEST_PROVIDERS` config var, so it is
  # readable with `heroku config -a job-os` rather than living only in a
  # dashboard text box. It still excludes bamboohr, icims and smartrecruiters.
  #
  # schedule:
  #   - cron: "17 */6 * * *"

# A sweep that overlaps itself would double the load on every vendor for no gain,
# and the second one would find every token already claimed as not-yet-due.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    name: crawl the boards that are due
    runs-on: ubuntu-latest
    # Generous against the 400-token default so a slow vendor cannot strand the
    # run mid-group; the worker commits per group and the next run resumes.
    timeout-minutes: 30
    env:
      # One credential, because there is one store again. `APPWRITE_API_KEY`
      # used to be here: `job_postings` had moved to Appwrite and this workflow
      # was not updated with it, so every scheduled run for four days crawled
      # nothing and exited 1 on `AppwriteTablesError: APPWRITE_API_KEY is not
      # configured`. A red scheduled job that nobody is paged for is
      # indistinguishable from one that was never turned on, which is how that
      # stayed unnoticed. All three steps below are Postgres-only now, so
      # handing this job an Appwrite key would grant it access it has no use
      # for.
      DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
      # What a run crawls when nothing tells it otherwise, which is every
      # scheduled run. Excludes bamboohr, icims and smartrecruiters; see the
      # header. A dispatch may still name any subset, including those.
      SCHEDULED_PROVIDERS: "greenhouse lever ashby workday oracle_cloud"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Sync dependencies
        working-directory: apps/api
        run: uv sync --frozen

      # Fail before the first request rather than after 400 of them. Without this
      # a missing secret produces a run that crawls four vendors' APIs and then
      # discards everything it learned at the first database write.
      - name: Refuse to crawl without somewhere to put the result
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::INGEST_DATABASE_URL is not set. Refusing to crawl" \
                 "public APIs and throw the answer away."
            exit 1
          fi

      # Deliberately not `alembic upgrade head`. A crawler should not migrate the
      # database it writes to; deploys own that. If the schema is behind, the
      # sweep should fail loudly rather than quietly changing it at 3am.
      - name: Crawl
        working-directory: apps/api
        run: |
          uv run python -m job_os.ingest.cli sweep \
            --limit "${{ github.event.inputs.limit || 400 }}" \
            --concurrency 8 \
            --providers ${{ github.event.inputs.providers || env.SCHEDULED_PROVIDERS }}

      # Second pass, and separate on purpose. The list endpoints of five
      # vendors carry no job description, so those rows land with
      # `jd_hydrated=false` and a body built from the title alone: rankable,
      # but not scoreable and useless to the tailor. This fetches the real one.
      #
      # It runs after the crawl rather than inside it because it is an N+1 by
      # nature, one request per posting, and its budget is a different
      # question from how many boards to visit. `--limit` bounds it; the
      # freshest unhydrated rows go first, which is the window a search reads.
      #
      # `continue-on-error`, because a sweep that crawled successfully must not
      # be reported as failed by the pass that runs after it. The same reason
      # the status report below carries it.
      - name: Hydrate descriptions
        # `always()`, not just `continue-on-error`. Hydration fills in rows the
        # index ALREADY has, so it is useful whether or not this run's crawl
        # worked, and skipping it on a crawl failure means a bad afternoon at
        # one vendor also stops descriptions being fetched for everyone else.
        # Observed exactly that: `dedupe_recent` timed out, the crawl step went
        # red, and hydration never ran despite having nothing to do with it.
        if: always()
        continue-on-error: true
        working-directory: apps/api
        run: |
          uv run python -m job_os.ingest.cli hydrate \
            --limit "${{ github.event.inputs.hydrate_limit || 200 }}" \
            --providers ${{ github.event.inputs.providers || env.SCHEDULED_PROVIDERS }}

      - name: Report index state
        if: always()
        # A diagnostic must never fail the work it is reporting on. A sweep
        # that crawled 1,958 postings successfully was marked failed because
        # this step could not read a counter afterwards, which is the wrong
        # way round: the crawl is the job, this is the note about it.
        #
        # The per-counter degradation `index_stats` grew for that incident is
        # gone with the store that needed it: every counter is one exact
        # `COUNT(*)` on the same connection now, so a failure here means the
        # database was unreachable and the Crawl step above would have said so
        # first. `continue-on-error` stays regardless, because the rule is
        # about which step owns the run's verdict, not about which store it
        # reads.
        continue-on-error: true
        working-directory: apps/api
        run: uv run python -m job_os.ingest.cli status
