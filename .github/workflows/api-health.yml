name: api-health

# Formerly keep-warm. It was three defects in fifty-nine lines:
#
#   1. it pinged https://job-os-api.vercel.app, which is not the API. The API runs
#      on Heroku (app `job-os`). That Vercel project is a retired half-finished
#      deploy and currently answers 500 to everything, so the real production API
#      has never been warmed or checked by this workflow at all.
#   2. every non-200 was downgraded to ::warning:: with exit 0, so it could not go
#      red. It reported green throughout while curling a 500.
#   3. its own "Validate config" step hard-coded https://*.vercel.app, so pointing
#      it at the correct Heroku origin would have failed validation. The guard
#      actively prevented the fix.
#
# The warming premise is also void: the dyno is Basic, not Eco, and sleeping after
# 30 minutes of inactivity is Eco-specific. There is no cold start to prevent.
#
# So this is now an honest health check rather than a warmer: correct origin, a
# non-200 fails the run, no sleep loop, and a 15-minute cadence instead of 5.

on:
  schedule:
    - cron: "7/15 * * * *"    # every 15 minutes, offset from the hour
  workflow_dispatch:

concurrency:
  group: api-health
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The Heroku origin. Overridable as a repo variable so moving the API does
      # not require editing this file -- which is what made defect 3 above stick.
      API_ORIGIN: ${{ vars.API_ORIGIN || 'https://job-os-328bbf87b8ba.herokuapp.com' }}
    steps:
      - name: Check /health
        run: |
          set -uo pipefail
          status=$(curl -sS -o /tmp/body -w '%{http_code}' \
            --max-time 30 --retry 2 --retry-delay 5 \
            "$API_ORIGIN/health" || echo "curl-failed")

          echo "GET $API_ORIGIN/health -> $status"
          echo "body: $(head -c 200 /tmp/body 2>/dev/null)"

          if [ "$status" != "200" ]; then
            echo "::error::API health check failed with status $status"
            exit 1
          fi

      - name: Warn if the deployed commit has drifted from main
        env:
          GH_TOKEN: ${{ github.token }}
          # How far behind main the running image may fall before this stops
          # being a warning. Drift of a commit or two is the manual deploy
          # working as intended; drift of this many is a container nobody has
          # shipped, which is a different fact and deserves a different colour.
          STALE_COMMITS: ${{ vars.STALE_COMMITS || 10 }}
        run: |
          set -uo pipefail
          # Warns on any drift, and FAILS once it is unmistakably stale.
          #
          # Warning-only was the right first call: a red run for "not deployed
          # yet" would train everyone to ignore this workflow, which is the
          # defect this file used to have pointed the other way. But a warning
          # that is true for fourteen commits and eight hours is one nobody
          # reads either. On 2026-08-29 the container sat on 49fc979 while main
          # reached 660da0a, and every one of those fourteen commits was a fix
          # to code that only runs in this container: the JD parse race, the
          # stranded-parse sweep, the Eightfold reader, the duplicate-company
          # guard, and both education-scoring corrections. The check reported
          # all of it correctly and stayed green.
          #
          # So the line moves rather than the behaviour: still amber while a
          # deploy is merely pending, red once it is overdue.
          deployed=$(curl -sS --max-time 30 "$API_ORIGIN/health" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("git_sha","unknown"))' \
            2>/dev/null || echo "unreadable")
          echo "deployed git_sha : $deployed"
          echo "main tip         : $GITHUB_SHA"

          case "$deployed" in
            unknown|unreadable)
              echo "::warning::/health reports no git_sha. The running image predates the build arg, so drift cannot be checked."
              exit 0 ;;
            "$GITHUB_SHA")
              echo "production matches main"
              exit 0 ;;
          esac

          # How far behind, asked of the API rather than inferred. A count is
          # the thing that separates "merged ten minutes ago" from "forgotten".
          behind=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${deployed}...${GITHUB_SHA}" \
            --jq '.ahead_by' 2>/dev/null || echo "")
          if [ -z "$behind" ]; then
            # A deployed commit the API cannot resolve is usually one built from
            # a branch that has since been deleted. Worth saying, not worth
            # failing over: the drift itself is already reported above.
            echo "::warning::production is running $deployed but main is at $GITHUB_SHA, and the distance could not be computed. See docs/DEPLOY.md."
            exit 0
          fi

          echo "commits behind   : $behind (threshold $STALE_COMMITS)"
          if [ "$behind" -ge "$STALE_COMMITS" ]; then
            echo "::error::production is $behind commits behind main ($deployed vs $GITHUB_SHA). That is past the point where this is a deploy in flight. See docs/DEPLOY.md."
            exit 1
          fi
          echo "::warning::production is running $deployed but main is at $GITHUB_SHA ($behind commits). See docs/DEPLOY.md."

      - name: Check /health/ready
        run: |
          set -uo pipefail
          # /health/ready touches the database, so this is the check that catches
          # a live container talking to a dead Postgres -- the failure /health
          # alone cannot see.
          status=$(curl -sS -o /tmp/ready -w '%{http_code}' \
            --max-time 30 --retry 2 --retry-delay 5 \
            "$API_ORIGIN/health/ready" || echo "curl-failed")

          echo "GET $API_ORIGIN/health/ready -> $status"
          echo "body: $(head -c 200 /tmp/ready 2>/dev/null)"

          if [ "$status" != "200" ]; then
            echo "::error::API readiness check failed with status $status"
            exit 1
          fi
