name: ci

# The repo's first real CI. Before this, .github/workflows/ contained exactly one
# file -- a cron that curled /health -- so the 349 tests in apps/api had never been
# run by any automation, and neither had ruff, mypy, tsc or the web build. A commit
# that broke an honesty guard reached main green because "green" did not exist.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 07:12 UTC. Offset from the hour because schedulers are busiest there.
    - cron: "12 7 * * *"

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # pgvector rather than plain postgres: the first migration runs
        # CREATE EXTENSION IF NOT EXISTS vector, so stock postgres cannot migrate.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: job_os
          POSTGRES_PASSWORD: job_os
          POSTGRES_DB: job_os
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://job_os:job_os@localhost:5432/job_os
      # No APP_ENV. It defaults to "production", which is the right posture for a
      # test run, and setting it here made an ambient value leak into a test that
      # was asserting what the *default* is.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Sync dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Alembic migrations
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: pytest
        working-directory: apps/api
        run: uv run pytest -q

      # Typst renders 5 of the 6 bundled templates in production
      # (RENDER_ENGINE=typst, and every template except moderncv sets
      # typst_ready), and until now it had no CI coverage at all -- the only
      # render job in this file compiles the Tectonic path, nightly. That is
      # backwards: the engine serving almost every render was the one nothing
      # checked. This runs per-commit rather than nightly because it can: Typst
      # is a single static binary and these compiles take about a second in
      # total, against roughly ten minutes for the Tectonic equivalent.
      - name: Install Typst
        env:
          TYPST_VERSION: 0.15.1
        run: |
          set -euo pipefail
          url="https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          curl -fsSL "$url" | tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          typst --version

      - name: Typst templates render
        working-directory: apps/api
        run: uv run python -m job_os.scripts.check_typst_templates

      - name: ruff + mypy ratchet
        run: ./scripts/lint-ratchet.sh

  functions:
    name: functions (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/functions/job-os-agents/uv.lock

      # apps/functions/job-os-agents is the Appwrite Function that actually runs the
      # tailor/review/finalize agent (main.py), and until the reap_stale_running_jobs
      # suite landed here it had zero test coverage, so this file never ran anything
      # against it either. That was not a harmless gap: an unpinned anthropic ceiling
      # in this directory's requirements.txt (what Appwrite actually installs from)
      # once crossed a breaking major version and silently broke a live tailor call,
      # and neither the api nor the web job below would ever have caught it, because
      # neither touches apps/functions/ at all.
      #
      # This runs as its own job rather than a step folded into `api`, because the
      # two directories' dependencies are deliberately separate: this one has its own
      # requirements.txt, its own capped anthropic<1.0.0, and now its own test-only
      # pyproject.toml/uv.lock (mirrors requirements.txt, never shipped; main.py still
      # deploys as the single file the README's build command expects). A `uv sync`
      # here resolves and installs only that graph, in its own venv, so it can never
      # be quietly satisfied or masked by whatever apps/api happens to have installed.
      # These tests do import job_os.* straight from apps/api/src (see this
      # pyproject.toml's pythonpath), but only as source, never as an installed
      # package, so apps/api's own web-only dependencies (fastapi, sqlalchemy,
      # celery, ...) are never pulled in and never need to be.
      #
      # No paths: filter, here or on this workflow's `on:` block above: every push
      # and pull request runs this job, so a change to main.py or anything it imports
      # can never be the one change that silently skips it.
      - name: Sync dependencies
        working-directory: apps/functions/job-os-agents
        run: uv sync --frozen

      - name: pytest
        working-directory: apps/functions/job-os-agents
        run: uv run pytest -q

  web:
    name: web (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Dummy values. The build inlines NEXT_PUBLIC_* at compile time and fails
      # without them; none of these reach a real service.
      NEXT_PUBLIC_APPWRITE_PROJECT_ID: ci-dummy-project
      NEXT_PUBLIC_APPWRITE_ENDPOINT: https://ci.invalid/v1
      NEXT_PUBLIC_APPWRITE_DATABASE_ID: ci-dummy-db
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      NEXT_PUBLIC_PIPELINE_BACKEND: legacy
      NEXT_PUBLIC_WORKSPACE_BACKEND: legacy
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The web package's own tests, which until the title taxonomy landed did
      # not exist. They run on Node's built-in TypeScript support, so they need
      # no build step and no transpiler, and they are pure functions over
      # generated data, so they need no services.
      - name: Test
        run: pnpm --filter @job-os/web test

      - name: Build
        run: pnpm build

  # The render tests do ~20 real Tectonic compiles and take about ten minutes,
  # which is too slow for every push but too valuable to run never -- they are
  # the only coverage of the Tectonic path. That path is not legacy: moderncv
  # is the one bundled template never ported to Typst, and every custom or
  # uploaded template stays on Tectonic deliberately, because the sandboxing
  # for executing somebody else's markup (--untrusted, the forbidden-command
  # screen, the scrubbed environment) exists only there. Typst covers the rest
  # and is checked per-commit in the `api` job above. Nightly, plus on demand.
  slow-render:
    name: slow render tests (nightly)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No DATABASE_URL and no postgres service: the render tests never open a
    # connection, and tests/conftest.py setdefault()s a placeholder so import
    # time does not fail. Declaring a URL for a database that is not running
    # would be a lie that happens to work.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      # From the upstream release, not apt: Tectonic is not packaged for Ubuntu,
      # so `apt-get install tectonic` fails with "Unable to locate package" and
      # this job had never once passed. Same source and same version the
      # production image uses (apps/api/Dockerfile.vercel), so the nightly
      # exercises the binary that actually ships rather than a distro's build
      # of some other version. Note the `@` in the release tag is
      # percent-encoded.
      - name: Install Tectonic
        env:
          TECTONIC_VERSION: 0.17.0
        run: |
          set -euo pipefail
          url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$url" | sudo tar -xz -C /usr/local/bin tectonic
          sudo chmod 0755 /usr/local/bin/tectonic
          tectonic --version
      - working-directory: apps/api
        run: uv sync --frozen
      # Tectonic downloads its TeX bundle on first compile. Unwarmed, every
      # test races that fetch and they fail together on
      # "called `Result::unwrap()` on an `Err` value: this bundle isn't
      # available" -- which is what 25 of them did the first time this job got
      # far enough to run at all. The production image solves it by baking a
      # warmed TECTONIC_CACHE_DIR (Dockerfile.vercel), so do the same here and
      # keep it across runs: one fetch ever, instead of one per nightly.
      - name: Cache Tectonic bundle
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tectonic-cache
          key: tectonic-bundle-0.17.0-${{ runner.os }}
      # Two things this has to survive. `~` does not expand in a YAML `env:`
      # value, so the cache dir has to be a real path (runner.temp), or
      # Tectonic writes to a literal "~" directory that actions/cache never
      # sees. And the bundle host rate-limits shared CI egress: an unwarmed run
      # gets `HTTP 429 Too Many Requests` on
      # relay.fullyjustified.net/default_bundle_v33.tar.index.gz. Retry, since
      # 429 is by definition transient.
      - name: Warm the Tectonic cache
        id: warm
        continue-on-error: true
        working-directory: apps/api
        env:
          TECTONIC_CACHE_DIR: ${{ runner.temp }}/tectonic-cache
        run: |
          for attempt in 1 2 3; do
            if uv run python -m job_os.scripts.warm_latex_cache; then
              exit 0
            fi
            echo "warm attempt $attempt failed; backing off"
            sleep $((attempt * 30))
          done
          exit 1
      # A rate-limited CDN is not a broken template, and a red build that means
      # "someone else's host was busy" is the alarm nobody reads by the second
      # week. Skip loudly instead, and keep red for an actual compile failure.
      - name: pytest -m slow
        if: steps.warm.outcome == 'success'
        working-directory: apps/api
        env:
          TECTONIC_CACHE_DIR: ${{ runner.temp }}/tectonic-cache
        run: uv run pytest -q -m slow
      - name: Report a skipped run
        if: steps.warm.outcome != 'success'
        run: |
          echo "::warning::Skipped the render tests: could not fetch Tectonic's bundle (upstream rate limit). Templates were not verified this run."
