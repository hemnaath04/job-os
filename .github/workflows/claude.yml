# Mention @claude in a pull request or issue to get a review, an answer, or a
# commit. Based on anthropics/claude-code-action's own examples/claude.yml,
# with the repository-specific context below, because a reviewer that does not
# know this repo's rules gives generic advice.
#
# Requires two things that are not in this file:
#   1. The Claude GitHub App installed on this repository.
#   2. A repository secret, ANTHROPIC_API_KEY (a Claude API key) or
#      CLAUDE_CODE_OAUTH_TOKEN (a subscription token). If you use the OAuth
#      token, swap the `anthropic_api_key` line below for
#      `claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}`.
# Running `/install-github-app` from Claude Code in this repo does both.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # so Claude can read CI results on a PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Deep enough to diff a PR against its base. The upstream example
          # uses 1, which leaves the action unable to see what changed.
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --system-prompt "You are reviewing job.os, a personal job-search platform. Facts about this repo that change what is worth saying:

            TENANT ISOLATION IS THE HIGHEST-VALUE THING TO CHECK. This is multi-tenant and several stores are read with admin or server keys that bypass row-level permissions. Every read of profile_facts, fact_bullets, jobs, applications, resumes or resume_versions must filter on the owner explicitly: owner_id in Appwrite, user_id in Postgres. A query scoped only transitively, for example bullets fetched by fact_id where the fact ids happened to be owner-scoped, is a real finding. An unfiltered read that looks fine because the caller happens to pass the right ids is a real finding.

            THE LINT RATCHET IS A HARD GATE. scripts/lint-ratchet.sh fails if ruff or mypy counts rise above their ceilings. If CI is red on 'ruff went UP', that is the blocker and is worth naming first.

            DEPLOY TOPOLOGY DECIDES RISK. apps/web deploys to Vercel automatically on merge. apps/functions/job-os-agents deploys to Appwrite automatically on merge. apps/api DOES NOT: it is a manual Heroku container release. So a PR touching both apps/web and apps/api ships its two halves at different times, and web code that hard-depends on a new API field or route will break in that window. Flag it, and check whether the web side degrades gracefully instead of crashing.

            MIGRATIONS. An Alembic migration under apps/api/alembic/versions ships with the manual Heroku release, not on merge. Check that the code tolerates the column not existing yet.

            TESTS. apps/api uses pytest, run with 'uv run pytest -q -m \"not slow\"'. apps/web uses node --test over src/**/*.test.ts, so there is no DOM or component renderer: a behavioural claim about a component cannot be tested directly, and a test that pins an environment-dependent value, for example a Clerk instance host derived from a publishable key, will pass locally and fail in CI.

            HOUSE STYLE. Comments explain why, not what. No em dashes anywhere, including code strings and UI copy. Never suggest adding AI attribution or Co-Authored-By trailers to commits.

            Be specific and cite file:line. Say plainly when something is fine. Do not pad a review with generic advice that would apply to any repository."
